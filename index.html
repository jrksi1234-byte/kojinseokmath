<!doctype html>
<html lang="ko"><head><meta charset="utf-8">

<title>고진석 수학학원 강의실</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E📐%3C/text%3E%3C/svg%3E">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<style id="app-style">
/* Layout: 상단 학원 이름 + 학년 탭(7) → 강의 목록 → 강의 화면(왼쪽 플레이어 고정, 오른쪽 섹션별 재생목록) */
:root{
  --bg:#F4F7F6; --surface:#FFFFFF; --ink:#14201C; --mute:#5A6A65; --line:#DAE3E0;
  --accent:#1B6A58; --accent-ink:#FFFFFF; --hl:#E6F1ED; --danger:#B23A3A; --grid:#E3EBE8;
  --font:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --serif:'Noto Serif KR','Batang',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1614; --surface:#172420; --ink:#E6EEEB; --mute:#93A39D; --line:#27362F;
  --accent:#4FB79C; --accent-ink:#0B1411; --hl:#1B2E29; --danger:#E47A7A; --grid:#1A2723; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1614; --surface:#172420; --ink:#E6EEEB; --mute:#93A39D; --line:#27362F;
  --accent:#4FB79C; --accent-ink:#0B1411; --hl:#1B2E29; --danger:#E47A7A; --grid:#1A2723; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto}
.top{margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:18px max(16px,env(safe-area-inset-left,0px)) 0;
  background:
    linear-gradient(var(--grid) 1px,transparent 1px) 0 0/24px 24px,
    linear-gradient(90deg,var(--grid) 1px,transparent 1px) 0 0/24px 24px,var(--bg);
  border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:40px;height:40px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 22px/1 var(--serif);flex:none}
.brand h1{margin:0;font:700 20px/1.25 var(--serif);letter-spacing:-.01em}
.logo{height:44px;width:auto;display:block}
:root[data-theme="dark"] .logo{filter:invert(1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:invert(1)}}
.now{flex-wrap:wrap}
.brand p{margin:0;color:var(--mute);font-size:12.5px;letter-spacing:.04em}
.tctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tmode{font-size:12.5px;font-weight:700;color:var(--accent);background:var(--hl);padding:4px 10px;border-radius:99px}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:-1px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;background:transparent;padding:10px 16px;font-weight:700;color:var(--mute);border-bottom:3px solid transparent;display:flex;gap:6px;align-items:center}
.tab i{font-style:normal;font-size:11.5px;font-weight:500;background:var(--line);color:var(--mute);border-radius:99px;padding:0 7px;line-height:18px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.tab[aria-selected="true"] i{background:var(--hl);color:var(--accent)}
main{padding-top:20px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;display:inline-flex;align-items:center;gap:6px;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent}
.btn.dng{color:var(--danger);border-color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:default}
.ib{border:0;background:transparent;color:var(--mute);width:30px;height:30px;border-radius:6px;display:inline-grid;place-items:center;flex:none}
.ib:hover{background:var(--hl);color:var(--accent)}
.ib.dng{width:auto;padding:0 8px;color:var(--danger);font-size:12.5px;font-weight:700;background:var(--hl)}
.ic{display:block}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}
.addrow,.addv{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.addrow input,.addv textarea,.addsec input{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px}
.addv{flex-direction:column;padding:12px;background:var(--hl);border-radius:8px;margin:8px 12px 12px}
.addv .r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hint{margin:0;color:var(--mute);font-size:12.5px}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.crs{display:flex;align-items:center;gap:2px;padding-right:8px;border-top:1px solid var(--line)}
.crs:first-child{border-top:0}
.crs-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:14px 16px}
.crs-main:hover{background:var(--hl)}
.crs-t{flex:1;min-width:0;font-weight:700;overflow-wrap:anywhere}
.crs-m{color:var(--mute);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chev{color:var(--mute)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:40px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.sub{color:var(--mute);font-size:13px;margin:0 0 10px}
.vr{display:flex;align-items:center;gap:12px;width:100%;border:0;border-top:1px solid var(--line);background:var(--surface);text-align:left;padding:11px 16px;text-decoration:none;color:inherit}
.vr:first-child{border-top:0}
.vr:hover{background:var(--hl)}
.vr .t{flex:1;min-width:0;overflow-wrap:anywhere}
.vr .p{color:var(--mute);font-size:12.5px}
.back{border:0;background:transparent;color:var(--mute);display:inline-flex;align-items:center;gap:4px;padding:4px 6px 4px 0;font-weight:500}
.back:hover{color:var(--accent)}
.chead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 16px}
.chead h2{margin:0;font:700 22px/1.3 var(--serif);overflow-wrap:anywhere;flex:1 1 260px}
.ctitle{flex:1 1 260px;min-width:0;border:1px solid transparent;background:transparent;font:700 22px/1.3 var(--serif);padding:2px 6px;margin:0 -6px;border-radius:6px}
.ctitle:hover,.ctitle:focus{border-color:var(--line);background:var(--surface)}
.cv{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
.left{position:sticky;top:calc(env(safe-area-inset-top,0px) + 10px);z-index:3;min-width:0}
.stage{aspect-ratio:16/9;width:100%;background:#0A0F0D;border-radius:10px;overflow:hidden;display:grid;place-items:center;color:#9FB1AB;text-align:center;font-size:14px}
.stage video{width:100%;height:100%;display:block;background:#000}
.stage div{padding:16px}
.now{display:flex;align-items:center;gap:8px;margin-top:10px}
.now b{flex:1;min-width:0;overflow-wrap:anywhere}
.now small{display:block;color:var(--mute);font-weight:400}
.pl{min-width:0;display:flex;flex-direction:column;gap:10px}
details.sec{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
details.sec>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:11px 12px 11px 14px;cursor:pointer;font-weight:700}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary .car{color:var(--mute);transition:transform .15s}
details.sec[open]>summary .car{transform:rotate(90deg)}
.sec .st{flex:1;min-width:0;overflow-wrap:anywhere}
.sec .cnt{color:var(--mute);font-size:12.5px;font-weight:500;font-variant-numeric:tabular-nums}
.sti,.vti{flex:1;min-width:0;border:1px solid transparent;background:transparent;border-radius:6px;padding:3px 6px;font-weight:inherit}
.sti:hover,.sti:focus,.vti:hover,.vti:focus{border-color:var(--line);background:var(--bg)}
.row{display:flex;align-items:center;gap:10px;width:100%;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:9px 12px 9px 14px;text-decoration:none;color:inherit;font-size:14px}
button.row:hover,a.row:hover{background:var(--hl)}
.row .n{width:22px;flex:none;text-align:right;color:var(--mute);font-size:12.5px;font-variant-numeric:tabular-nums}
.row .t{flex:1;min-width:0;overflow-wrap:anywhere}
.row.on{background:var(--hl);color:var(--accent);font-weight:700}
.row.on .n{color:var(--accent)}
.chip{flex:none;font-size:11.5px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:0 7px;line-height:18px}
.addsec{display:flex;gap:8px;flex-wrap:wrap}
.ov{position:fixed;inset:0;background:rgba(5,10,8,.55);display:grid;place-items:center;padding:16px;z-index:30}
.dlg{width:100%;max-width:380px;background:var(--surface);border-radius:12px;padding:20px;border:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.dlg h3{margin:0;font-size:17px}
.dlg input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px}
.dlg .r{display:flex;gap:8px;justify-content:flex-end}
.err{color:var(--danger);font-size:13px;margin:0}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.barin{max-width:1120px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.barin span{flex:1 1 200px;font-size:14px}
@media (max-width:820px){
  .cv{grid-template-columns:minmax(0,1fr)}
  .brand h1{font-size:18px}
}

/* UI 개선 */
.top{box-shadow:0 1px 0 var(--line),0 6px 18px -12px rgba(0,0,0,.25)}
.mark{box-shadow:0 2px 6px -1px rgba(27,106,88,.5)}
.tab{transition:color .15s,border-color .15s}
.btn,.crs-main,.vr,.row{transition:background .15s,border-color .15s,transform .1s}
.btn:active{transform:scale(.97)}
.list,details.sec{box-shadow:0 1px 2px rgba(0,0,0,.04),0 4px 14px -8px rgba(0,0,0,.15)}
.crs-main:hover .chev{transform:translateX(3px)}
.chev{transition:transform .15s}
.stage{box-shadow:0 8px 24px -10px rgba(0,0,0,.45)}
.row.on{box-shadow:inset 3px 0 0 var(--accent)}
.row.on .n::before{content:'▶';font-size:9px}
.row.on .n{font-size:0}.row.on .n::before{font-size:11px}
.search:focus,.addrow input:focus,.dlg input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--hl)}
.btn.pri{box-shadow:0 2px 6px -2px rgba(27,106,88,.6)}
.chead h2,.ctitle{letter-spacing:-.015em}
@media (max-width:820px){.left{position:static}.tab{padding:10px 12px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.stage iframe{width:100%;height:100%;border:0;display:block}
</style></head><body>
<div id="app"></div>
<script>
(function(){
'use strict';
var G=['중1','중2','중3','고1','고2','고3','기타'];

var $=function(s,r){return (r||document).querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var uid=function(){return Math.random().toString(36).slice(2,9)};
var ss={get:function(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};
var S={courses:[]},D={courses:[]},dirty=false,loaded=false,loadOk=false,loadErr='';
var lsg=function(k){try{return localStorage.getItem(k)}catch(e){return null}},lss=function(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
var CFG=(function(){try{return JSON.parse(lsg('gh_cfg'))||{}}catch(e){return {}}})();
function guessRepo(){var m=location.hostname.match(/^([^.]+)\.github\.io$/);if(!m)return '';var seg=location.pathname.split('/')[1];return m[1]+'/'+(seg&&seg.indexOf('.')<0?seg:location.hostname)}
var ui={grade:G.indexOf(ss.get('grade'))>=0?ss.get('grade'):G[0],course:ss.get('course')||null,q:'',teacher:!!(CFG.token&&CFG.repo),
  play:null,addCourse:false,addVid:null,modal:null,modalErr:'',busy:false,msg:'',confirm:null,closed:{},focus:null,autoplay:false};

var P={up:'M6 15l6-6 6 6',down:'M6 9l6 6 6-6',x:'M6 6l12 12M18 6L6 18',plus:'M12 5v14M5 12h14',
  ext:'M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5',back:'M15 6l-6 6 6 6',chev:'M9 6l6 6-6 6',
  vid:'M4 6h11v12H4zM15 10l5-3v10l-5-3',play:'M8 5v14l11-7z',prev:'M19 5v14L8 12zM5 5v14',next:'M5 5v14l11-7zM19 5v14'};
function I(n,s){s=s||18;var f=(n==='play'||n==='prev'||n==='next');
  return '<svg class="ic" viewBox="0 0 24 24" width="'+s+'" height="'+s+'" '+(f?'fill="currentColor" stroke="none"':'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"')+' aria-hidden="true"><path d="'+P[n]+'"/></svg>'}

function mark(){dirty=true}
function nv(c){return c.sections.reduce(function(n,s){return n+s.videos.length},0)}
function course(){return D.courses.find(function(c){return c.id===ui.course})}
function flat(c){var a=[];c.sections.forEach(function(s){s.videos.forEach(function(v){a.push({s:s,v:v})})});return a}
function curItem(c){if(!ui.play)return null;var f=flat(c).filter(function(x){return x.s.id===ui.play.s&&x.v.id===ui.play.v});return f[0]||null}
function move(arr,i,d){var j=i+d;if(j<0||j>=arr.length)return;var t=arr[i];arr[i]=arr[j];arr[j]=t}
function safeUrl(u){return /^https?:\/\//i.test(u)?u:'#'}
function remember(){ss.set('grade',ui.grade);ss.set('course',ui.course||'')}

function vkind(v){
  var u=v.ref||'',m;
  if(m=u.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/))return{k:'yt',id:m[1]};
  if(m=u.match(/vimeo\.com\/(?:video\/)?(\d+)/))return{k:'vimeo',id:m[1]};
  if(m=u.match(/drive\.google\.com\/file\/d\/([\w-]+)/))return{k:'drive',id:m[1]};
  if(/\.(mp4|webm|mov|m4v|ogv)(\?|#|$)/i.test(u))return{k:'file'};
  return{k:'ext'};
}
function playable(v){return vkind(v).k!=='ext'}
function vlabel(v){return {yt:'YouTube',vimeo:'Vimeo',drive:'Drive',file:'영상',ext:'링크'}[vkind(v).k]}
function stage(v){
  var k=vkind(v),a=ui.autoplay?'1':'0';
  var fr=function(src){return '<iframe src="'+src+'" title="'+esc(v.title)+'" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>'};
  if(k.k==='yt')return fr('https://www.youtube.com/embed/'+k.id+'?rel=0&playsinline=1&autoplay='+a);
  if(k.k==='vimeo')return fr('https://player.vimeo.com/video/'+k.id+'?autoplay='+a);
  if(k.k==='drive')return fr('https://drive.google.com/file/d/'+k.id+'/preview');
  return '<video id="vp" controls preload="metadata" src="'+esc(safeUrl(v.ref))+'"></video>';
}
function b64(str){var b=new TextEncoder().encode(str),s='',i;for(i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(s)}
function utf8dec(t){var s=atob(t.replace(/\s/g,'')),a=new Uint8Array(s.length),i;for(i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return new TextDecoder().decode(a)}
function gh(method,path,body){
  var h={Authorization:'Bearer '+CFG.token,Accept:'application/vnd.github+json'};if(body)h['Content-Type']='application/json';
  return fetch('https://api.github.com/repos/'+CFG.repo+'/'+path,{method:method,headers:h,body:body?JSON.stringify(body):undefined,cache:'no-store'});
}

/* ---------- views ---------- */
function head(){
  var t=ui.teacher
    ? '<span class="tmode">선생님 모드</span><button class="btn" data-act="tout">나가기</button>'
    : '<button class="btn ghost" data-act="tlogin">선생님</button>';

function gradeView(){
  var cs=D.courses.filter(function(c){return c.grade===ui.grade});
  var q=ui.q.trim().toLowerCase();
  var h='<div class="tools"><input id="q" class="search" type="search" placeholder="'+ui.grade+' 영상·강의 검색" value="'+esc(ui.q)+'" autocomplete="off">';
  if(ui.teacher)h+='<button class="btn pri" data-act="caddtoggle">'+I('plus')+' 강의 추가</button>';
  h+='</div>';
  if(ui.teacher&&ui.addCourse)h+='<div class="addrow"><input id="newCourse" data-enter="caddok" placeholder="강의 제목 (예: 2026 겨울방학 방정식 완성)" maxlength="80"><button class="btn pri" data-act="caddok">만들기</button></div>';
  if(q){
    var res=[];
    cs.forEach(function(c){c.sections.forEach(function(s){s.videos.forEach(function(v){
      if((v.title+' '+c.title+' '+s.title).toLowerCase().indexOf(q)>=0)res.push({c:c,s:s,v:v})})})});
    if(!res.length)return h+'<div class="empty"><b>검색 결과가 없습니다</b>다른 단어로 검색해 보세요.</div>';
    h+='<p class="sub">검색 결과 '+res.length+'개</p><div class="list">';
    res.slice(0,80).forEach(function(r){
      var inner=I(playable(r.v)?'vid':'ext',16)+'<span class="t">'+esc(r.v.title)+'<br><span class="p">'+esc(r.c.title)+' · '+esc(r.s.title)+'</span></span>';
      h+=!playable(r.v)
        ?'<a class="vr" href="'+esc(safeUrl(r.v.ref))+'" target="_blank" rel="noopener noreferrer">'+inner+'</a>'
        :'<button class="vr" data-act="gopen" data-id="'+r.c.id+'" data-s="'+r.s.id+'" data-v="'+r.v.id+'">'+inner+'</button>';
    });
    h+='</div>';
    if(res.length>80)h+='<p class="sub">검색어를 더 구체적으로 입력하면 나머지를 볼 수 있습니다. (80개까지 표시)</p>';
    return h;
  }
  if(!cs.length)return h+'<div class="empty"><b>'+ui.grade+' 강의가 아직 없습니다</b>'+(ui.teacher?'‘강의 추가’로 첫 강의를 만들어 보세요.':'새 강의가 올라오면 여기에 표시됩니다.')+'</div>';
  h+='<div class="list">';
  cs.forEach(function(c,i){
    h+='<div class="crs"><button class="crs-main" data-act="open" data-id="'+c.id+'"><span class="crs-t">'+esc(c.title)+'</span><span class="crs-m">섹션 '+c.sections.length+' · 영상 '+nv(c)+'</span><span class="chev">'+I('chev')+'</span></button>';
    if(ui.teacher)h+='<button class="ib" data-act="cup" data-id="'+c.id+'" aria-label="위로">'+I('up')+'</button><button class="ib" data-act="cdown" data-id="'+c.id+'" aria-label="아래로">'+I('down')+'</button>'+
      (ui.confirm==='c'+c.id?'<button class="ib dng" data-act="cdel" data-id="'+c.id+'">삭제 확인</button>':'<button class="ib" data-act="cdel" data-id="'+c.id+'" aria-label="삭제">'+I('x')+'</button>');
    h+='</div>';
  });
  return h+'</div>';
}

function courseView(){
  var c=course();if(!c){ui.course=null;return gradeView()}
  var t=ui.teacher,cur=curItem(c),h='';
  h+='<button class="back" data-act="back">'+I('back')+' '+c.grade+' 강의 목록</button>';
  h+='<div class="chead">'+(t?'<input class="ctitle" data-ch="ctitle" value="'+esc(c.title)+'" maxlength="80" aria-label="강의 제목">':'<h2>'+esc(c.title)+'</h2>')+'<span class="sub" style="margin:0">섹션 '+c.sections.length+' · 영상 '+nv(c)+'</span></div>';
  h+='<div class="cv"><div class="left"><div class="stage">';
  if(cur&&playable(cur.v))h+=stage(cur.v);
  else if(cur)h+='<div>외부 링크 영상입니다.<br><a style="color:#7FD6BD" href="'+esc(safeUrl(cur.v.ref))+'" target="_blank" rel="noopener noreferrer">새 탭에서 열기</a></div>';
  else h+='<div>오른쪽 재생목록에서<br>영상을 선택하세요.</div>';
  h+='</div>';
  if(cur){
    h+='<div class="now"><b>'+esc(cur.v.title)+'<small>'+esc(cur.s.title)+'</small></b>'+(vkind(cur.v).k==='file'?'<button class="btn" data-act="nfs">'+I('play',16)+' 기기 플레이어</button>':'')+'<button class="btn" data-act="prev">'+I('prev',16)+' 이전</button><button class="btn pri" data-act="next">다음 '+I('next',16)+'</button></div>';
  }
  h+='</div><div class="pl">';
  if(!c.sections.length)h+='<div class="empty"><b>섹션이 없습니다</b>'+(t?'아래에서 섹션을 추가하세요.':'')+'</div>';
  c.sections.forEach(function(s,si){
    h+='<details class="sec" data-sid="'+s.id+'" '+(ui.closed[s.id]?'':'open')+'><summary><span class="car">'+I('chev',16)+'</span>';
    h+=t?'<input class="sti" data-ch="stitle" data-s="'+s.id+'" value="'+esc(s.title)+'" maxlength="80" aria-label="섹션 제목">':'<span class="st">'+esc(s.title)+'</span>';
    h+='<span class="cnt">'+s.videos.length+'</span>';
    if(t)h+='<button class="ib" data-act="sup" data-s="'+s.id+'" aria-label="섹션 위로">'+I('up')+'</button><button class="ib" data-act="sdown" data-s="'+s.id+'" aria-label="섹션 아래로">'+I('down')+'</button>'+
      (ui.confirm==='s'+s.id?'<button class="ib dng" data-act="sdel" data-s="'+s.id+'">삭제 확인</button>':'<button class="ib" data-act="sdel" data-s="'+s.id+'" aria-label="섹션 삭제">'+I('x')+'</button>');
    h+='</summary>';
    s.videos.forEach(function(v,vi){
      var on=cur&&cur.v.id===v.id;
      if(t){
        h+='<div class="row'+(on?' on':'')+'"><span class="n">'+(vi+1)+'</span><input class="vti" data-ch="vtitle" data-s="'+s.id+'" data-v="'+v.id+'" value="'+esc(v.title)+'" maxlength="120" aria-label="영상 제목"><span class="chip">'+vlabel(v)+'</span>'+
          (playable(v)?'<button class="ib" data-act="play" data-s="'+s.id+'" data-v="'+v.id+'" aria-label="재생">'+I('play',16)+'</button>':'<a class="ib" href="'+esc(safeUrl(v.ref))+'" target="_blank" rel="noopener noreferrer" aria-label="링크 열기">'+I('ext',16)+'</a>')+
          '<button class="ib" data-act="vup" data-s="'+s.id+'" data-v="'+v.id+'" aria-label="위로">'+I('up',16)+'</button><button class="ib" data-act="vdown" data-s="'+s.id+'" data-v="'+v.id+'" aria-label="아래로">'+I('down',16)+'</button>'+
          (ui.confirm==='v'+v.id?'<button class="ib dng" data-act="vdel" data-s="'+s.id+'" data-v="'+v.id+'">삭제 확인</button>':'<button class="ib" data-act="vdel" data-s="'+s.id+'" data-v="'+v.id+'" aria-label="삭제">'+I('x',16)+'</button>')+'</div>';
      }else if(!playable(v)){
        h+='<a class="row" href="'+esc(safeUrl(v.ref))+'" target="_blank" rel="noopener noreferrer"><span class="n">'+(vi+1)+'</span><span class="t">'+esc(v.title)+'</span><span class="chip">링크</span>'+I('ext',16)+'</a>';
      }else{
        h+='<button class="row'+(on?' on':'')+'" data-act="play" data-s="'+s.id+'" data-v="'+v.id+'"><span class="n">'+(on?I('play',12):(vi+1))+'</span><span class="t">'+esc(v.title)+'</span></button>';
      }
    });
    if(!s.videos.length&&!t)h+='<div class="row"><span class="t" style="color:var(--mute)">등록된 영상이 없습니다.</span></div>';
    if(t){
      if(ui.addVid===s.id){
        h+='<div class="addv"><textarea id="bulk" rows="4" placeholder="링크로 추가: 한 줄에 영상 하나, 「제목 | 주소」 형식&#10;예) 1강 이차방정식 | https://youtu.be/..."></textarea>'+
          '<div class="r"><button class="btn pri" data-act="addlinks" data-s="'+s.id+'">링크 추가</button>'+
          '<button class="btn ghost" data-act="vcancel">닫기</button></div>'+
          '<p class="hint">용량 제한 없이 쓰려면 영상을 YouTube(일부 공개)에 올리고 주소만 붙여넣으세요. mp4·webm 직접 주소, Vimeo, Google Drive 링크도 이 화면에서 재생됩니다.</p></div>';
      }else h+='<div class="row" style="padding:6px 10px"><button class="btn ghost" data-act="vaddopen" data-s="'+s.id+'">'+I('plus',16)+' 영상 추가</button></div>';
    }
    h+='</details>';
  });
  if(t)h+='<div class="addsec"><input id="newSec" data-enter="saddok" placeholder="새 섹션 제목 (예: 1단원 이차방정식)" maxlength="80"><button class="btn pri" data-act="saddok">'+I('plus',16)+' 섹션 추가</button></div>';
  return h+'</div></div>';
}

function modal(){
  if(!ui.modal)return '';
  return '<div class="ov" data-act="mbg"><div class="dlg" role="dialog" aria-modal="true" aria-label="선생님 로그인"><h3>선생님 로그인</h3>'+
    '<p class="hint">GitHub 저장소와 토큰(Contents 읽기·쓰기 권한)을 입력하세요. 토큰은 이 기기에만 저장됩니다.</p>'+
    '<input id="repo" data-enter="mok" placeholder="저장소 (예: 아이디/저장소이름)" value="'+esc(ui.rp||CFG.repo||guessRepo())+'" autocomplete="off">'+
    '<input id="tok" type="password" data-enter="mok" placeholder="GitHub 토큰" autocomplete="off">'+
    (ui.modalErr?'<p class="err">'+esc(ui.modalErr)+'</p>':'')+
    '<div class="r"><button class="btn ghost" data-act="mcancel">취소</button><button class="btn pri" data-act="mok">확인</button></div></div></div>';
}

function bar(){
  if(!dirty&&!ui.msg&&!ui.busy)return '';
  var b='<div class="bar"><div class="barin"><span>'+esc(ui.msg||(dirty?'저장하지 않은 변경 사항이 있습니다.':''))+'</span>';
  if(dirty)b+='<button class="btn" data-act="discard"'+(ui.busy?' disabled':'')+'>되돌리기</button><button class="btn pri" data-act="publish"'+(ui.busy?' disabled':'')+'>'+(ui.busy?'처리 중…':'저장하기')+'</button>';
  return b+'</div></div>';
}

function render(){
  var f=document.activeElement,rf=f&&f.id==='q',pos=rf?f.selectionStart:0;
  $('#app').innerHTML=head()+'<main class="wrap">'+(loaded?(ui.course?courseView():gradeView()):'<div class="empty"><b>'+esc(loadErr||'불러오는 중…')+'</b></div>')+'</main>'+bar()+modal();
  if(rf){var q=$('#q');if(q){q.focus();try{q.setSelectionRange(pos,pos)}catch(e){}}}
  if(ui.focus){var el=document.getElementById(ui.focus);if(el)el.focus();ui.focus=null}
  var v=$('#vp');
  if(v){v.addEventListener('ended',function(){step(1,true)});if(ui.autoplay){v.play().catch(function(){})}}
  ui.autoplay=false;
}
var toastT;
function toast(m){ui.msg=m;render();clearTimeout(toastT);if(!ui.busy)toastT=setTimeout(function(){ui.msg='';render()},5000)}

/* ---------- actions ---------- */
function playOn(sid,vid,auto){ui.play={s:sid,v:vid};ui.autoplay=!!auto;render()}
function step(d,onlyFile){
  var c=course();if(!c||!ui.play)return;
  var a=flat(c),i=a.findIndex(function(x){return x.v.id===ui.play.v});
  for(var j=i+d;j>=0&&j<a.length;j+=d){if(playable(a[j].v)){playOn(a[j].s.id,a[j].v.id,true);return}}
}
function openCourse(id,sid,vid){
  ui.course=id;ui.q='';remember();ui.play=null;
  var c=course();
  if(sid)ui.play={s:sid,v:vid},ui.autoplay=true;
  else if(c){var f=flat(c).filter(function(x){return playable(x.v)})[0];if(f)ui.play={s:f.s.id,v:f.v.id}}
  render();window.scrollTo(0,0);
}
function del(key,fn){if(ui.confirm===key){ui.confirm=null;fn();mark();render()}else{ui.confirm=key;render()}}
function sec(id){var c=course();return c&&c.sections.filter(function(s){return s.id===id})[0]}
function swapCourse(id,d){
  var idx=[];D.courses.forEach(function(c,i){if(c.grade===ui.grade)idx.push(i)});
  var p=idx.findIndex(function(i){return D.courses[i].id===id}),q=p+d;
  if(q<0||q>=idx.length)return;
  var a=idx[p],b=idx[q],t=D.courses[a];D.courses[a]=D.courses[b];D.courses[b]=t;mark();render();
}

function addLinks(sid){
  var s=sec(sid),ta=$('#bulk');if(!s||!ta)return;
  var n=0,bad=0;
  ta.value.split(/\n+/).forEach(function(line){
    line=line.trim();if(!line)return;
    var i=line.indexOf('|'),title,url;
    if(i>=0){title=line.slice(0,i).trim();url=line.slice(i+1).trim()}else{url=line;title=line}
    if(!/^https?:\/\/\S+$/i.test(url)){bad++;return}
    s.videos.push({id:uid(),title:title||url,type:'link',ref:url});n++;
  });
  if(n){mark();ui.addVid=null}
  toast(n?n+'개 추가했습니다. 저장하기를 눌러 반영하세요.'+(bad?' (형식이 맞지 않은 '+bad+'줄은 제외)':''):'주소는 http:// 또는 https:// 로 시작해야 합니다. 형식: 제목 | 주소');
}

async function load(){
  var txt=null;loadOk=false;loadErr='';
  if(CFG.token&&CFG.repo){try{var r=await gh('GET','contents/data.json');if(r.ok){txt=utf8dec((await r.json()).content);loadOk=true}else if(r.status===404){txt='{"courses":[]}';loadOk=true}}catch(e){}}
  if(txt==null){try{var r2=await fetch('data.json?t='+Date.now(),{cache:'no-store'});if(r2.ok){txt=await r2.text();loadOk=true}else if(r2.status===404){txt='{"courses":[]}';loadOk=true}}catch(e){}}
  try{S=JSON.parse(txt||'{}')}catch(e){S={};loadOk=false}
  if(!loadOk)loadErr=location.protocol==='file:'?'GitHub Pages 주소로 열어야 강의가 보입니다.':'강의 목록을 불러오지 못했습니다. 새로고침 해 주세요.';
  S.courses=S.courses||[];D=JSON.parse(JSON.stringify(S));loaded=true;
}
async function publish(){
  if(!loadOk){toast('데이터를 불러오지 못해 저장할 수 없습니다. 새로고침 후 다시 시도하세요.');return}
  ui.busy=true;ui.msg='저장하는 중…';render();
  try{
    var r=await gh('GET','contents/data.json'),sha;
    if(r.status===404)sha=undefined;else if(r.ok)sha=(await r.json()).sha;else throw r.status;
    var out=JSON.stringify({v:2,courses:D.courses},null,1);
    var p=await gh('PUT','contents/data.json',{message:'강의 목록 업데이트',content:b64(out),sha:sha});
    if(!p.ok)throw p.status;
    S=JSON.parse(out);D=JSON.parse(out);dirty=false;ui.busy=false;
    toast('저장했습니다. 1~2분 뒤 학생 화면에 반영됩니다.');
  }catch(e){
    ui.busy=false;
    toast(e===401||e===403||e===404?'저장 권한이 없습니다. 나가기 후 다시 로그인하고 토큰 권한(Contents 읽기·쓰기)을 확인하세요.':e===409||e===422?'다른 변경과 겹쳤습니다. 저장하기를 한 번 더 눌러 주세요.':'저장하지 못했습니다. 네트워크를 확인하고 다시 시도하세요.');
  }
}

async function modalOk(){
  var repo=(($('#repo')||{}).value||'').trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/+$/,''),tok=(($('#tok')||{}).value||'').trim();
  ui.rp=repo;
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){ui.modalErr='저장소를 「아이디/저장소이름」 형식으로 입력하세요.';ui.focus='repo';render();return}
  if(!tok){ui.modalErr='토큰을 입력하세요.';ui.focus='tok';render();return}
  try{
    var r=await fetch('https://api.github.com/repos/'+repo,{headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'}});
    if(!r.ok){ui.modalErr=r.status===404||r.status===401?'저장소 또는 토큰이 올바르지 않습니다.':'확인하지 못했습니다. 잠시 후 다시 시도하세요.';ui.focus='tok';render();return}
    var j=await r.json();
    if(j.permissions&&!j.permissions.push){ui.modalErr='이 토큰에는 쓰기 권한이 없습니다.';ui.focus='tok';render();return}
  }catch(e){ui.modalErr='네트워크 오류입니다.';render();return}
  CFG={repo:repo,token:tok};lss('gh_cfg',JSON.stringify(CFG));
  ui.teacher=true;ui.modal=null;ui.modalErr='';loaded=false;render();await load();render();
}

var A={
  grade:function(t){ui.grade=t.dataset.g;ui.q='';ui.course=null;ui.addCourse=false;remember();render()},
  open:function(t){openCourse(t.dataset.id)},
  gopen:function(t){openCourse(t.dataset.id,t.dataset.s,t.dataset.v)},
  back:function(){ui.course=null;ui.play=null;remember();render();window.scrollTo(0,0)},
  play:function(t){playOn(t.dataset.s,t.dataset.v,true)},
  prev:function(){step(-1)},next:function(){step(1)},
  tlogin:function(){ui.modal='login';ui.modalErr='';ui.focus=(CFG.repo||guessRepo())?'tok':'repo';render()},
  tout:function(){ui.teacher=false;CFG={};lss('gh_cfg',null);dirty=false;D=JSON.parse(JSON.stringify(S));ui.addCourse=false;ui.addVid=null;render()},
  mok:function(){modalOk()},mcancel:function(){ui.modal=null;ui.modalErr='';render()},
  mbg:function(t,e){if(e.target===t)A.mcancel()},
  caddtoggle:function(){ui.addCourse=!ui.addCourse;if(ui.addCourse)ui.focus='newCourse';render()},
  caddok:function(){
    var el=$('#newCourse'),v=el?el.value.trim():'';if(!v){ui.focus='newCourse';render();return}
    var c={id:uid(),grade:ui.grade,title:v,sections:[{id:uid(),title:'1단원',videos:[]}]};
    D.courses.push(c);mark();ui.addCourse=false;openCourse(c.id);
  },
  cup:function(t){swapCourse(t.dataset.id,-1)},cdown:function(t){swapCourse(t.dataset.id,1)},
  cdel:function(t){del('c'+t.dataset.id,function(){D.courses=D.courses.filter(function(c){return c.id!==t.dataset.id})})},
  saddok:function(){
    var c=course(),el=$('#newSec'),v=el?el.value.trim():'';if(!c||!v){ui.focus='newSec';render();return}
    c.sections.push({id:uid(),title:v,videos:[]});mark();ui.focus='newSec';render();
  },
  sup:function(t){var c=course(),i=c.sections.findIndex(function(s){return s.id===t.dataset.s});move(c.sections,i,-1);mark();render()},
  sdown:function(t){var c=course(),i=c.sections.findIndex(function(s){return s.id===t.dataset.s});move(c.sections,i,1);mark();render()},
  sdel:function(t){del('s'+t.dataset.s,function(){var c=course();c.sections=c.sections.filter(function(s){return s.id!==t.dataset.s});if(ui.play&&ui.play.s===t.dataset.s)ui.play=null})},
  vaddopen:function(t){ui.addVid=t.dataset.s;ui.focus='bulk';render()},
  vcancel:function(){ui.addVid=null;render()},
  addlinks:function(t){addLinks(t.dataset.s)},
  vup:function(t){var s=sec(t.dataset.s),i=s.videos.findIndex(function(v){return v.id===t.dataset.v});move(s.videos,i,-1);mark();render()},
  vdown:function(t){var s=sec(t.dataset.s),i=s.videos.findIndex(function(v){return v.id===t.dataset.v});move(s.videos,i,1);mark();render()},
  vdel:function(t){del('v'+t.dataset.v,function(){var s=sec(t.dataset.s);s.videos=s.videos.filter(function(v){return v.id!==t.dataset.v});if(ui.play&&ui.play.v===t.dataset.v)ui.play=null})},
  discard:function(){D=JSON.parse(JSON.stringify(S));dirty=false;ui.msg='';ui.addVid=null;ui.addCourse=false;if(ui.course&&!course())ui.course=null;render()},
  publish:function(){publish()}
};

var app=$('#app');
app.addEventListener('click',function(e){
  var sm=e.target.closest('summary');
  if(sm&&e.target.closest('input,button,a'))e.preventDefault();
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act;
  if(!/del$/.test(a)&&ui.confirm)ui.confirm=null;
  if(A[a])A[a](t,e);
});
app.addEventListener('input',function(e){
  if(e.target.id==='q'){ui.q=e.target.value;render()}
});
app.addEventListener('change',function(e){
  var t=e.target,k=t.dataset.ch;
  if(!k)return;
  var c=course();if(!c)return;var v=t.value.trim();
  if(k==='ctitle'){if(v){c.title=v;mark()}else t.value=c.title}
  else if(k==='stitle'){var s=sec(t.dataset.s);if(s&&v){s.title=v;mark()}}
  else if(k==='vtitle'){var s2=sec(t.dataset.s),vi=s2&&s2.videos.filter(function(x){return x.id===t.dataset.v})[0];if(vi&&v){vi.title=v;mark()}}
  var b=$('.bar');if(!b){var d=document.createElement('div');d.innerHTML=bar();if(d.firstChild)app.appendChild(d.firstChild)}
});
app.addEventListener('keydown',function(e){
  var t=e.target;
  if(e.key==='Enter'&&!e.isComposing&&t.dataset&&t.dataset.enter){e.preventDefault();A[t.dataset.enter](t,e)}
  if(e.key==='Escape'&&ui.modal)A.mcancel();
});
app.addEventListener('toggle',function(e){
  var d=e.target;if(d&&d.classList&&d.classList.contains('sec')){ui.closed[d.dataset.sid]=!d.open}
},true);

render();load().then(render);
})();

/* 재생 편의: 배속 유지 + 끝나면 다음 영상 자동 재생 */
(function(){var rate=1;
document.addEventListener('ratechange',function(e){if(e.target.id==='vp')rate=e.target.playbackRate},true);
document.addEventListener('loadedmetadata',function(e){if(e.target.id==='vp')e.target.playbackRate=rate},true);
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-act=nfs]');if(!b)return;var v=document.getElementById('vp');if(!v)return;
if(v.webkitEnterFullscreen)v.webkitEnterFullscreen();else if(v.requestFullscreen)v.requestFullscreen();v.play()},true);
document.addEventListener('keydown',function(e){var v=document.getElementById('vp');if(!v||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
if(e.key==='ArrowRight')v.currentTime+=10;else if(e.key==='ArrowLeft')v.currentTime-=10;else if(e.key===' '){e.preventDefault();v.paused?v.play():v.pause()}});
})();
</script>
